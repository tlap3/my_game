name: Ultimate Keep Alive (Immortal App)

on:
  schedule:
    - cron: '0 */2 * * *' # รันทุก 2 ชั่วโมง
  workflow_dispatch:      # กดรันเองได้ด้วยมือ

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    # เพิ่ม env บรรทัดนี้เพื่อลบคำเตือนเรื่อง Node.js 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    permissions:
      contents: write
      
    steps:
      - uses: actions/checkout@v4 # ตัวนี้ยังใช้ได้ดีที่สุดในปัจจุบันครับ
      
      - name: Ping All Apps
        run: |
          echo "กำลังปลุกแอปศูนย์กลาง (Hub)..."
          curl -s -m 30 "https://streamlit.app" > /dev/null || echo "Hub สะกิดแล้ว"
          
          echo "กำลังปลุกแอปคำศัพท์จีน..."
          curl -s -m 30 "https://streamlit.app" > /dev/null || echo "ศัพท์จีนสะกิดแล้ว"
          
          echo "กำลังปลุกหน้าเกมยิง (GitHub Pages)..."
          curl -s -m 30 "https://github.io" > /dev/null
          
      - name: Create empty commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit --allow-empty -m "Immortal Ping: $(date)"
          git push
