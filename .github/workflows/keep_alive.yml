name: Keep All My Apps Alive (Every 2 Hours)

on:
  schedule:
    # รันทุกๆ 2 ชั่วโมง (00:00, 02:00, 04:00 ... เป็นต้น)
    - cron: '0 */2 * * *'
  workflow_dispatch:      # ปุ่มกดรันเองเพื่อทดสอบในหน้า Actions

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping All Streamlit Apps
        run: |
          echo "กำลังปลุกแอปศูนย์กลาง (Hub)..."
          curl -L -I "https://tlap03.streamlit.app/"
          
          echo "กำลังปลุกแอปคำศัพท์จีน..."
          curl -L -I "https://tlap03-chinese-vocab-app.streamlit.app/"
          
          echo "กำลังปลุกหน้าเกมยิง (GitHub Pages)..."
          curl -L -I "https://tlap3.github.io/my_game/Target-Mania-Boss-Alert/"

      - name: Status Check
        run: echo "ปลุกทุกแอปเรียบร้อยแล้วเมื่อเวลา $(date)"
