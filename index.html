<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Target Mania</title>
    <!-- ใช้ตัวรันตรงๆ จากแหล่งที่เสถียรที่สุด -->
    <script src="https://github.io"></script>
</head>
<body style="margin:0; background-color:black; color:lime; display:flex; justify-content:center; align-items:center; height:100vh; font-family:monospace;">
    
    <div id="status">⏳ กำลังโหลด...</div>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        window.onload = function() {
            // เช็คว่าระบบ Python พร้อมไหม
            if (window.AsyncPython) {
                document.getElementById('status').innerHTML = "📦 Loading setup.tar.gz...";
                window.AsyncPython.run("canvas", "setup.tar.gz");
            } else {
                document.getElementById('status').innerHTML = "❌ Engine Error - ลองเปลี่ยนเน็ตหรือกด Ctrl+F5";
            }
        };
    </script>
</body>
</html>
