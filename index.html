<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Target Mania</title>
    <!-- ใช้ CDN ของ Pygame-web เวอร์ชันที่เสถียร -->
    <script src="https://github.io"></script>
</head>
<body style="margin:0; background-color:black; overflow:hidden;">
    <canvas id="canvas" style="width:100%; height:100vh;"></canvas>
    <script>
        window.addEventListener("load", () => {
            // สั่งรันโดยระบุไฟล์ setup.tar.gz
            if (window.AsyncPython) {
                console.log("Starting game...");
                window.AsyncPython.run("canvas", "setup.tar.gz");
            } else {
                console.error("Python Engine not loaded");
            }
        });
    </script>
</body>
</html>
