<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Target Mania</title>
    <!-- เรียกไฟล์ที่เราเพิ่งสร้างไว้ใน GitHub ของเราเอง -->
    <script src="pythons.js"></script>
</head>
<body style="margin:0; background-color:black; color:#00ff00; display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; font-family:monospace;">
    <div id="status">🚀 กำลังเชื่อมต่อเครื่องยนต์เกม...</div>
    <canvas id="canvas" style="display:none;"></canvas>
    <script>
        window.addEventListener("load", async () => {
            // หน่วงเวลา 2 วินาทีเพื่อให้สคริปต์พร้อม
            setTimeout(async () => {
                if (typeof window.AsyncPython !== 'undefined' || window.python) {
                    document.getElementById('status').innerHTML = "📦 กำลังโหลดไฟล์เกม (setup.tar.gz)...";
                    try {
                        const engine = window.AsyncPython || window.python;
                        await engine.run("canvas", "setup.tar.gz");
                        document.getElementById('status').style.display = "none";
                        document.getElementById('canvas').style.display = "block";
                    } catch (e) {
                        document.getElementById('status').innerHTML = "❌ ไม่พบไฟล์ setup.tar.gz";
                    }
                } else {
                    document.getElementById('status').innerHTML = "❌ ระบบยังไม่พร้อม กรุณากด Ctrl+F5";
                }
            }, 2000);
        });
    </script>
</body>
</html>
