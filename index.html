<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Target Mania: Boss Alert</title>
    <style>
        body { margin: 0; background-color: black; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #canvas { border: 2px solid #333; }
    </style>
    <!-- ดึงตัวรันจาก CDN ของ Pygame-web -->
    <script src="https://github.io"></script>
</head>
<body>
    <!-- ส่วนแสดงผลเกม -->
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="1"></canvas>

    <script>
        // ตั้งค่าการรันเกม
        window.onload = function() {
            // สั่งให้รันโดยดึงไฟล์ setup.tar.gz ของคุณมาใช้
            // หากไฟล์ของคุณชื่ออื่น ให้แก้ชื่อตรง "setup.tar.gz" ให้ตรงกัน
            window.AsyncPython.run("canvas", "setup.tar.gz");
        };
    </script>
</body>
</html>
