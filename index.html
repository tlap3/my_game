<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Target Mania</title>
    <!-- ใช้ CDN สำรองที่โหลดง่ายที่สุด (ห้ามลบบรรทัดนี้) -->
    <script src="https://jsdelivr.net"></script>
</head>
<body style="margin:0; background-color:black; color:lime; display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; font-family:monospace; text-align:center;">

    <div id="status">⏳ กำลังสตาร์ทเครื่องยนต์...</div>
    <div id="progress" style="display:none; color:cyan; margin-top:10px;">📦 กำลังโหลดไฟล์เกม (setup.tar.gz)...</div>
    
    <canvas id="canvas" style="display:none; border:2px solid #333;"></canvas>

    <script>
        async function start() {
            const status = document.getElementById('status');
            const progress = document.getElementById('progress');
            const canvas = document.getElementById('canvas');

            // รอเครื่องยนต์สูงสุด 10 วินาที
            for (let i = 0; i < 20; i++) {
                if (window.AsyncPython || window.python) {
                    const engine = window.AsyncPython || window.python;
                    status.style.display = "none";
                    progress.style.display = "block";
                    try {
                        // สั่งรันไฟล์เกมของคุณ
                        await engine.run("canvas", "setup.tar.gz");
                        progress.style.display = "none";
                        canvas.style.display = "block";
                        return;
                    } catch (e) {
                        progress.innerHTML = "❌ ไม่พบไฟล์ setup.tar.gz";
                        return;
                    }
                }
                await new Promise(r => setTimeout(r, 500)); // รอทีละ 0.5 วินาที
            }
            status.innerHTML = "❌ เครื่องยนต์ไม่ตอบสนอง (Timeout)<br>กรุณาใช้เน็ตมือถือทดสอบ หรือกด Ctrl+F5";
        }

        window.onload = start;
    </script>
</body>
</html>
