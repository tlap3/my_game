<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Target Mania</title>
    <!-- ✅ เรียกใช้ไฟล์ pythons.js ที่อยู่ใน Repository ของคุณเอง -->
    <script src="pythons.js"></script>
</head>
<body style="margin:0; background-color:black; color:lime; display:flex; justify-content:center; align-items:center; height:100vh; font-family:monospace;">
    <div id="status">⏳ กำลังเชื่อมต่อเครื่องยนต์...</div>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        let checkEngine = setInterval(() => {
            // ตรวจสอบว่าไฟล์ pythons.js ในเครื่องทำงานหรือยัง
            if (window.AsyncPython || window.python) {
                clearInterval(checkEngine);
                const engine = window.AsyncPython || window.python;
                document.getElementById('status').innerHTML = "📦 กำลังโหลดเกม (1.6 MB)...";
                engine.run("canvas", "setup.tar.gz");
            }
        }, 500);

        setTimeout(() => {
            if (document.getElementById('status').innerHTML === "⏳ กำลังเชื่อมต่อเครื่องยนต์...") {
                document.getElementById('status').innerHTML = "❌ ระบบขัดข้อง - ไม่พบไฟล์ pythons.js ในหน้าแรก";
            }
        }, 10000);
    </script>
</body>
</html>
