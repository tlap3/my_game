<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Target Mania</title>
    <!-- ใช้ CDN เวอร์ชัน 0.9.3 ล่าสุดที่เสถียรที่สุด -->
    <script src="https://github.io"></script>
</head>
<body style="margin:0; background-color:black; color:cyan; display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; font-family:monospace;">

    <div id="status">⏳ Initializing Engine...</div>
    <canvas id="canvas" style="display:none; border: 1px solid #333;"></canvas>

    <script>
        const status = document.getElementById('status');
        const canvas = document.getElementById('canvas');

        // ฟังก์ชันเริ่มรันเกม
        async function startGame() {
            if (window.python) {
                status.innerHTML = "📦 Loading Assets (setup.tar.gz)...";
                try {
                    // รันไฟล์ก้อนใหญ่ของคุณ
                    await window.python.run("canvas", "setup.tar.gz");
                    status.style.display = "none";
                    canvas.style.display = "block";
                } catch (e) {
                    status.innerHTML = "❌ Error: Cannot load setup.tar.gz";
                    console.error(e);
                }
            } else {
                status.innerHTML = "❌ Engine Timeout: Please Refresh (Ctrl+F5)";
            }
        }

        // เริ่มต้นหลังจากโหลดหน้าเสร็จ
        window.addEventListener("load", () => {
            setTimeout(startGame, 1000); // รอ 1 วินาทีให้สคริปต์ทำงาน
        });
    </script>
</body>
</html>
