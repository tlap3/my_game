<!DOCTYPE html>
<html>
<head>
    <script src="https://github.io"></script>
</head>
<body style="margin:0; background-color:black;">
    <canvas id="canvas" style="width:100%; height:100vh;"></canvas>
    <script>
        // บังคับให้ระบบโหลดไฟล์ setup.tar.gz ทันทีที่เปิดหน้าเว็บ
        window.addEventListener("load", () => {
            if (window.AsyncPython) {
                window.AsyncPython.run("canvas", "setup.tar.gz");
            }
        });
    </script>
</body>
</html>
